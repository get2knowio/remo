name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # Superseded by a newer commit on the same ref — nothing external is touched.

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Core only: the first-party provider plugins (plugins/*) are left out
      # so remo's own suite proves it needs none of them. Each plugin's suite
      # runs in its own job below, with the plugin installed.
      - name: Install dependencies
        run: uv sync --all-extras --no-extra hetzner --no-extra ec2 --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest --tb=short -q

  plugin-hetzner:
    name: Hetzner plugin (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # The way a user gets it: remo-cli's [hetzner] extra.
      - name: Install remo with the hetzner extra
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      # --syntax-check resolves every module name, so the playbook-layout
      # tests need the collections remo would install on first use.
      - name: Install the Galaxy collections remo + the plugin require
        run: |
          uv run --no-sync ansible-galaxy collection install -r ansible/requirements.yml
          uv run --no-sync ansible-galaxy collection install -r plugins/hetzner/src/remo_provider_hetzner/ansible/requirements.yml

      - name: Run the plugin's tests
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest plugins/hetzner/tests --tb=short -q

      - name: Ruff check
        run: uv run --no-sync ruff check plugins/hetzner/src

      - name: Mypy check
        run: uv run --no-sync mypy plugins/hetzner/src

  plugin-ec2:
    name: EC2 plugin (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # The way a user gets it: remo-cli's [ec2] extra.
      - name: Install remo with the ec2 extra
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      # --syntax-check resolves every module name, so the playbook-layout
      # tests need the collections remo would install on first use.
      - name: Install the Galaxy collections remo + the plugin require
        run: |
          uv run --no-sync ansible-galaxy collection install -r ansible/requirements.yml
          uv run --no-sync ansible-galaxy collection install -r plugins/ec2/src/remo_provider_ec2/ansible/requirements.yml

      - name: Run the plugin's tests
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest plugins/ec2/tests --tb=short -q

      - name: Ruff check
        run: uv run --no-sync ruff check plugins/ec2/src

      - name: Mypy check
        run: uv run --no-sync mypy plugins/ec2/src

  docker-image:
    name: Docker image (amd64 + arm64)
    runs-on: ubuntu-latest
    # This job is the only thing that actually builds docker/Dockerfile. The
    # tests/image/ checks that run in the `test` job above are structural --
    # they grep the Dockerfile for the right strings -- so without this a
    # genuinely broken image (failed npm ci, moved asset path, bad arch
    # branch) ships green. Multi-minute by nature: an emulated arm64 build
    # runs npm ci and pip install under QEMU.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Registers binfmt handlers so the arm64 half of tests/image/ can build
      # under emulation on an amd64 runner. The arch-selection branch
      # (FR-027/FR-042) has no other way to be exercised here.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      # REMO_RUN_IMAGE_TESTS=1 opts into tier 2 of tests/image/: real
      # `docker buildx build` for amd64 + arm64, then runs the built image
      # under compose.example.yml's hardening flags and asserts non-root UID,
      # a genuinely read-only rootfs, an arch-correct session-manager-plugin,
      # and that /api/v1/ready gates on missing mounts. The tests skip
      # honestly (not fail) if emulation turns out to be unusable.
      - name: Build and verify the remo-web image
        env:
          REMO_RUN_IMAGE_TESTS: "1"
        run: uv run pytest tests/image/ -v --tb=short

  wheel-install:
    name: Wheel install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Every workspace member: remo-cli plus the first-party provider plugins.
      - name: Build wheels
        run: uv build --wheel --all-packages

      - name: Install wheel into a fresh venv (non-editable)
        run: |
          uv venv /tmp/remo-wheel-test
          uv pip install --python /tmp/remo-wheel-test/bin/python dist/remo_cli-*.whl

      - name: Verify ansible dir is found and contains playbooks
        run: |
          /tmp/remo-wheel-test/bin/python - <<'EOF'
          from remo_cli.core.config import get_ansible_dir
          d = get_ansible_dir()
          print(f"ansible_dir: {d}")
          assert (d / "incus_configure.yml").is_file(), f"incus_configure.yml not found in {d}"
          assert (d / "requirements.yml").is_file(), f"requirements.yml not found in {d}"
          assert not (d / "__init__.py").exists(), f"ansible_dir looks like a Python package: {d}"
          print("OK: ansible playbooks found in installed wheel")
          EOF

      # #222: entry-point discovery is package metadata, so prove it on the
      # built wheels (fixture plugin + remo-provider-hetzner), not the tree.
      - name: Verify provider-plugin discovery on the built wheels
        run: scripts/check_plugin_wheels.sh dist

  fish-completion:
    name: Fish completion (real shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install fish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish

      # The activation script shells out to `remo` by name, so it has to be a
      # real binary on PATH — `uv run remo` would never be found by fish.
      - name: Install remo onto PATH
        run: |
          uv sync
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Asserting on the text of the generated script is not enough: the bug
      # this guards against (a2542e9) produced a script that read fine and
      # emitted a screenful of errors the moment fish executed it.
      - name: Run completions in a real fish shell
        run: ./tests/integration/fish_completion.sh

  lint:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check src/remo_cli

      # mypy analyses against python_version = "3.11" from [tool.mypy], so the
      # result is independent of whichever interpreter uv resolves here. The
      # `web` extra must be installed (it is, via --all-extras) or every
      # src/remo_cli/web/ module degrades to Any and the gate goes blind.
      - name: Mypy check
        run: uv run mypy src/remo_cli

  frontend:
    name: Frontend (typecheck + unit + build)
    runs-on: ubuntu-latest
    # Fast, backend-free coverage of the SPA: tsc typecheck, the Vitest
    # unit/component suite (frontend/src/**/*.test.ts), the browser geometry
    # suite (frontend/tests/geometry), and a production build.
    #
    # The geometry suite runs here because it is self-contained: it serves a
    # fixture page with Vite and answers the terminal API/WebSocket from inside
    # the spec. It covers what jsdom structurally cannot — jsdom has no layout
    # engine, so every element measures 0x0 and any assertion about the terminal
    # grid fitting its box passes vacuously there.
    #
    # The Playwright e2e suite (frontend/tests/e2e) is still NOT run here — it needs
    # a live `remo web serve` backend (REMO_E2E_BASE_URL); see playwright.config.ts.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Check generated types are fresh
        run: npm run check:types-fresh

      - name: Unit tests
        run: npm run test

      # Chromium only — the geometry suite runs the same specs twice against it
      # (WebGL and DOM renderers) and needs no other browser.
      - name: Install Chromium for the geometry suite
        run: npx playwright install --with-deps chromium

      - name: Browser geometry tests
        run: npm run test:geometry

      - name: Build
        run: npm run build
