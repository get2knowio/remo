name: Cleanup Stale CI Resources

# Safety net: finds and destroys cloud resources left behind by failed or
# cancelled smoke test runs. Resources are identified by the "ci-" name prefix.

on:
  schedule:
    - cron: '15 */4 * * *'  # Every 4 hours at :15
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-cleanup
  # Never cancel: the terminate/delete steps run in sequence (instances, then
  # key pairs, then security groups), so a cancelled run can leave that
  # sequence half-applied. Cancelling does not itself create orphans — this
  # workflow is the safety net that reaps them — but a scheduled run must not
  # interrupt a manual one mid-delete.
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # AWS — terminate stale EC2 instances
  # ===========================================================================
  cleanup-aws:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: remo-cleanup-${{ github.run_id }}
          aws-region: us-west-2

      - name: Terminate stale CI instances
        run: |
          CUTOFF=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S 2>/dev/null || \
                   date -u -v-1H +%Y-%m-%dT%H:%M:%S)

          echo "Looking for remo CI instances launched before $CUTOFF..."

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=ci-*" \
              "Name=tag:remo,Values=true" \
              "Name=instance-state-name,Values=running,stopped" \
            --query "Reservations[].Instances[?LaunchTime<=\`${CUTOFF}\`].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "No stale instances found."
            exit 0
          fi

          for id in $INSTANCE_IDS; do
            echo "Terminating stale instance: $id"
            aws ec2 terminate-instances --instance-ids "$id"
          done

      - name: Clean up orphaned CI resources
        run: |
          # Delete key pairs with ci- prefix
          aws ec2 describe-key-pairs \
            --filters "Name=key-name,Values=ci-*" \
            --query "KeyPairs[].KeyName" --output text | tr '\t' '\n' | \
          while read -r name; do
            [ -z "$name" ] && continue
            echo "Deleting orphaned key pair: $name"
            aws ec2 delete-key-pair --key-name "$name"
          done

          # Delete security groups with ci- prefix (ignore failures from in-use groups)
          aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=ci-*" \
            --query "SecurityGroups[].{Id:GroupId,Name:GroupName}" --output text | \
          while read -r id name; do
            [ -z "$id" ] && continue
            echo "Deleting orphaned security group: $name ($id)"
            aws ec2 delete-security-group --group-id "$id" 2>/dev/null || true
          done

      # A smoke run that fails or times out while its snapshot is still
      # pending can leave a billable EBS snapshot behind (the job's own
      # teardown now waits it out; this is the safety net). Only smoke
      # snapshots: remo-snapshot-name ci-smoke-*, completed, over an hour old.
      - name: Delete stale CI snapshots
        run: |
          CUTOFF=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S 2>/dev/null || \
                   date -u -v-1H +%Y-%m-%dT%H:%M:%S)
          SNAP_IDS=$(aws ec2 describe-snapshots --owner-ids self \
            --filters \
              "Name=tag:remo,Values=true" \
              "Name=tag:remo-snapshot-name,Values=ci-smoke-*" \
              "Name=status,Values=completed" \
            --query "Snapshots[?StartTime<=\`${CUTOFF}\`].SnapshotId" \
            --output text)
          if [ -z "$SNAP_IDS" ] || [ "$SNAP_IDS" = "None" ]; then
            echo "No stale CI snapshots found."
            exit 0
          fi
          for id in $SNAP_IDS; do
            echo "Deleting stale CI snapshot: $id"
            aws ec2 delete-snapshot --snapshot-id "$id" || true
          done

  # ===========================================================================
  # Hetzner — delete stale servers, SSH keys and snapshots
  # ===========================================================================
  cleanup-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        uses: hetznercloud/setup-hcloud@28cdd3fc4a4a8013e86d57c7254be72df92fcc02 # v2

      - name: Delete stale CI servers
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          echo "Looking for stale Hetzner CI servers..."

          hcloud server list -o noheader -o columns=id,name,created | \
          while read -r id name created; do
            [ -z "$id" ] && continue

            # Only target servers with ci- prefix
            case "$name" in ci-*) ;; *) continue ;; esac

            age=$(( $(date +%s) - $(date -d "$created" +%s 2>/dev/null || echo 0) ))
            if [ "$age" -gt 3600 ]; then
              echo "Deleting stale server: $name ($id), age: ${age}s"
              hcloud server delete "$id"
            fi
          done

          # Also clean up SSH keys with ci- prefix
          hcloud ssh-key list -o noheader -o columns=id,name | \
          while read -r id name; do
            [ -z "$id" ] && continue
            case "$name" in ci-*) ;; *) continue ;; esac
            echo "Deleting orphaned SSH key: $name ($id)"
            hcloud ssh-key delete "$id" 2>/dev/null || true
          done

      # Same safety net as AWS: a smoke snapshot orphaned by a failed or
      # timed-out run (e.g. run 41381962224). Only smoke snapshots
      # (remo-snapshot-name ci-smoke-*), available, over an hour old; one
      # still `creating` is left for the next run.
      - name: Delete stale CI snapshots
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          CUTOFF=$(date -u -d '1 hour ago' +%s)
          hcloud image list --type snapshot --selector remo=true -o json | \
            jq -r --argjson cutoff "$CUTOFF" '.[]
              | select((.labels["remo-snapshot-name"] // "") | startswith("ci-smoke-"))
              | select(.status == "available")
              | select((.created | sub("\\+00:00$"; "Z") | fromdateiso8601) <= $cutoff)
              | "\(.id) \(.labels["remo-snapshot-name"])"' | \
          while read -r id name; do
            [ -z "$id" ] && continue
            echo "Deleting stale CI snapshot: $name ($id)"
            hcloud image delete "$id" || true
          done
