name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel — a cancelled publish can leave the tag, the GitHub Release
  # and GHCR out of step with each other.

# A `v*` tag means exactly two things: a public GitHub release carrying the
# wheels + manifest.json (+ attestations) that install.sh reads, and the GHCR
# remo-web image. Nothing here — or anywhere in this repo — uploads to PyPI or
# TestPyPI (constitution principle IX, v3.0.0).

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --tb=short -q

  build:
    # ONE build feeds the GitHub release (specs/031-install-path R1): remo-cli
    # and every first-party plugin wheel are built here, so the release carries
    # the complete set the installer needs. GitHub Releases is the only package
    # channel; there is no PyPI upload.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      # Consumed by release/publish-image: pre-releases must not move the
      # `latest` image tag, and decide the manifest channel.
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check if pre-release
        id: prerelease
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # PEP 440 pre-release segments come in two written forms: canonical
          # (no separator — v4.4.0rc3 / v4.4.0a2 / v4.4.0b3 / v4.4.0.dev5) and
          # the dashed convenience form many projects use on git tags
          # (v4.4.0-rc1). Match both, each anchored on a trailing digit run.
          #
          # This replaced a bare substring test (`"$TAG" == *"rc"*`) that
          # classified any tag merely CONTAINING those letters: a hand-pushed
          # `v1.0.0-hotfix-search` matched on the "rc" inside "search" and
          # would have shipped a stable release as a pre-release. Kept
          # identical to get2knowio/airframe's release.yml, the portfolio
          # reference for this step;
          # tests/unit/test_release_prerelease_detection.py executes this
          # exact block rather than a copy of it.
          if [[ "$TAG" =~ -(rc|beta|alpha|dev)[0-9]+$ ]] \
             || [[ "$TAG" =~ [0-9](rc|a|b|c)[0-9]+$ ]] \
             || [[ "$TAG" =~ \.dev[0-9]+$ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a pre-release"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a stable release"
          fi

      - name: Build wheels + sdists
        run: uv build --all-packages -o dist

      - name: Verify provider-plugin discovery on the built wheels
        run: scripts/check_plugin_wheels.sh dist

      - name: Generate and verify the release manifest
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # A `v` tag is always the stable channel as far as the manifest and
          # installer are concerned (RCs are `rc-` tags, made by dev-build.yml);
          # the GitHub pre-release label above is independent of that.
          python3 scripts/release_manifest.py generate --dist dist --tag "$TAG" \
            --channel stable --repo "$GITHUB_REPOSITORY" --out dist/manifest.json
          python3 scripts/release_manifest.py verify --dist dist \
            --manifest dist/manifest.json --tag "$TAG"

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # build-provenance attestation
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Get previous tag
        id: prev_tag
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          IS_PRE="${{ needs.build.outputs.is_prerelease }}"

          if [ "$IS_PRE" == "true" ]; then
            # Pre-release: compare against immediately previous tag
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          else
            # Stable release: the previous STABLE tag. Restricted to the `v*`
            # release namespace, because `git tag -l` also lists the `rc-*`
            # tags dev-build.yml creates for GitHub pre-releases, which are not
            # releases at all. Pre-releases are then excluded with the same
            # anchored pattern the detection step above uses, as one combined
            # ERE; the old filter was an unanchored
            # `grep -v -E '(rc|beta|alpha|dev)'`, which would equally have
            # dropped a stable tag that merely contained those letters.
            PRE_RE='(-(rc|beta|alpha|dev)[0-9]+|[0-9](rc|a|b|c)[0-9]+|\.dev[0-9]+)$'
            PREV_TAG=$(git tag -l 'v*' | grep -v -E "$PRE_RE" | grep -v "^${TAG}$" | sort -V | tail -1)
            PREV_TAG="${PREV_TAG:-}"
          fi

          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          VERSION="${TAG#v}"

          # Create release notes file
          cat > release_notes.md << 'HEADER'
          ## Installation

          ```bash
          curl -fsSL https://raw.githubusercontent.com/get2knowio/remo/main/install.sh | bash
          # with the web console and a provider plugin:
          curl -fsSL https://raw.githubusercontent.com/get2knowio/remo/main/install.sh | bash -s -- --with web,ec2
          ```

          The wheels and `manifest.json` attached below are the release; the
          installer verifies each wheel's sha256 against the manifest.
          HEADER

          # Add pre-release note if applicable
          if [ "${{ needs.build.outputs.is_prerelease }}" == "true" ]; then
            cat >> release_notes.md << PRERELEASE

          > **Note:** This is a pre-release version for testing. Install its
          > wheel by URL:
          > \`\`\`bash
          > uv tool install --force "remo-cli @ https://github.com/${{ github.repository }}/releases/download/${TAG}/remo_cli-${VERSION}-py3-none-any.whl"
          > \`\`\`
          > RCs normally ship as \`rc-\` GitHub pre-releases from dev-build.yml;
          > \`install.sh --prerelease\` reads only those, so it cannot install
          > this \`v\`-tagged one. No remo build is ever uploaded to PyPI.
          PRERELEASE
          fi

          # Add changes section
          echo "" >> release_notes.md

          if [ "${{ needs.build.outputs.is_prerelease }}" == "true" ] && [ -n "$PREV_TAG" ]; then
            # Pre-release: list commits since previous tag
            echo "## Changes" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s" ${PREV_TAG}..HEAD >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...$TAG" >> release_notes.md
          elif [ "${{ needs.build.outputs.is_prerelease }}" == "false" ]; then
            # Stable release: use the curated tag annotation message
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG" | tail -n +2)
            if [ -n "$TAG_MSG" ]; then
              echo "$TAG_MSG" >> release_notes.md
            elif [ -n "$PREV_TAG" ]; then
              echo "## Changes" >> release_notes.md
              echo "" >> release_notes.md
              git log --pretty=format:"- %s" ${PREV_TAG}..HEAD >> release_notes.md
            fi
            echo "" >> release_notes.md
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...$TAG" >> release_notes.md
            fi
          else
            echo "Initial release" >> release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          draft: false
          # The wheels and the manifest ARE the release; install.sh reads them.
          # The manifest goes up in the next step, once every wheel is there.
          files: |
            dist/*.whl

      # Last, and on its own: a manifest.json asset is how install.sh and
      # `remo self-update` tell an installable release from one still being
      # published (#290). release-please publishes the vX.Y.Z release before
      # this workflow runs, so the release is visible asset-less for a while;
      # the manifest must never appear before the wheels it lists.
      - name: Attach the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release upload "$TAG" dist/manifest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl

  publish-image:
    # Publishes the remo-web container image that docker/compose.example.yml
    # pulls by default, so home-lab users can deploy with just a Compose file
    # instead of a full source checkout. It needs `build` for the pre-release
    # flag (which decides the `latest` tag) and `release` so the image never
    # appears for a tag whose GitHub release failed.
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # An emulated arm64 build (npm ci + pip install under QEMU) dominates
    # this job's runtime.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The build itself is .github/actions/publish-web-image, shared with
      # rc-image.yml so both channels build through one set of pinned docker/*
      # steps. `flavor: latest=false` lives in there; the raw `latest` tag below
      # re-adds it only for a stable release, so an rc/beta tag can never move
      # the `latest` that compose.example.yml pulls.
      #
      # `type=semver` reads the tag from `github.ref`, which is the pushed v*
      # tag here — a composite action shares the caller's github context, so
      # this keeps working unchanged.
      - name: Build and push the remo-web image
        uses: ./.github/actions/publish-web-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-spec: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.build.outputs.is_prerelease == 'false' }}
