name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel — a cancelled publish can leave the tag, the GitHub Release,
  # PyPI and GHCR out of step with each other.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --tb=short -q

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Consumed by publish-image to decide whether this tag may move the
      # `latest` image tag (pre-releases must not).
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check if pre-release
        id: prerelease
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # PEP 440 pre-release segments come in two written forms: canonical
          # (no separator — v4.4.0rc3 / v4.4.0a2 / v4.4.0b3 / v4.4.0.dev5) and
          # the dashed convenience form many projects use on git tags
          # (v4.4.0-rc1). Match both, each anchored on a trailing digit run.
          #
          # This replaced a bare substring test (`"$TAG" == *"rc"*`) that
          # classified any tag merely CONTAINING those letters: a hand-pushed
          # `v1.0.0-hotfix-search` matched on the "rc" inside "search" and
          # would have shipped a stable release as a pre-release. Kept
          # identical to get2knowio/airframe's release.yml, the portfolio
          # reference for this step;
          # tests/unit/test_release_prerelease_detection.py executes this
          # exact block rather than a copy of it.
          if [[ "$TAG" =~ -(rc|beta|alpha|dev)[0-9]+$ ]] \
             || [[ "$TAG" =~ [0-9](rc|a|b|c)[0-9]+$ ]] \
             || [[ "$TAG" =~ \.dev[0-9]+$ ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a pre-release"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a stable release"
          fi

      - name: Get previous tag
        id: prev_tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          IS_PRE="${{ steps.prerelease.outputs.is_prerelease }}"

          if [ "$IS_PRE" == "true" ]; then
            # Pre-release: compare against immediately previous tag
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          else
            # Stable release: the previous STABLE tag. Restricted to the `v*`
            # release namespace, because `git tag -l` also lists the `rc-*`
            # tags dev-build.yml creates for GitHub pre-releases, which are not
            # releases at all. Pre-releases are then excluded with the same
            # anchored pattern the detection step above uses, as one combined
            # ERE; the old filter was an unanchored
            # `grep -v -E '(rc|beta|alpha|dev)'`, which would equally have
            # dropped a stable tag that merely contained those letters.
            PRE_RE='(-(rc|beta|alpha|dev)[0-9]+|[0-9](rc|a|b|c)[0-9]+|\.dev[0-9]+)$'
            PREV_TAG=$(git tag -l 'v*' | grep -v -E "$PRE_RE" | grep -v "^${TAG}$" | sort -V | tail -1)
            PREV_TAG="${PREV_TAG:-}"
          fi

          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          VERSION="${TAG#v}"

          # Create release notes file
          cat > release_notes.md << 'HEADER'
          ## Installation

          ```bash
          # Run directly (no install needed)
          uvx remo-cli

          # Or install globally
          uv tool install remo-cli
          pip install remo-cli
          ```
          HEADER

          # Add pre-release note if applicable
          if [ "${{ steps.prerelease.outputs.is_prerelease }}" == "true" ]; then
            cat >> release_notes.md << PRERELEASE

          > **Note:** This is a pre-release version for testing. Install with:
          > \`\`\`bash
          > uv tool install remo-cli==${VERSION}
          > \`\`\`
          PRERELEASE
          fi

          # Add changes section
          echo "" >> release_notes.md

          if [ "${{ steps.prerelease.outputs.is_prerelease }}" == "true" ] && [ -n "$PREV_TAG" ]; then
            # Pre-release: list commits since previous tag
            echo "## Changes" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s" ${PREV_TAG}..HEAD >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...$TAG" >> release_notes.md
          elif [ "${{ steps.prerelease.outputs.is_prerelease }}" == "false" ]; then
            # Stable release: use the curated tag annotation message
            TAG_MSG=$(git tag -l --format='%(contents)' "$TAG" | tail -n +2)
            if [ -n "$TAG_MSG" ]; then
              echo "$TAG_MSG" >> release_notes.md
            elif [ -n "$PREV_TAG" ]; then
              echo "## Changes" >> release_notes.md
              echo "" >> release_notes.md
              git log --pretty=format:"- %s" ${PREV_TAG}..HEAD >> release_notes.md
            fi
            echo "" >> release_notes.md
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...$TAG" >> release_notes.md
            fi
          else
            echo "Initial release" >> release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          draft: false

  publish:
    needs: [test, release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-image:
    # Publishes the remo-web container image that docker/compose.example.yml
    # pulls by default, so home-lab users can deploy with just a Compose file
    # instead of a full source checkout.
    needs: [test, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # An emulated arm64 build (npm ci + pip install under QEMU) dominates
    # this job's runtime.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The build itself is .github/actions/publish-web-image, shared with
      # rc-image.yml so both channels build through one set of pinned docker/*
      # steps. `flavor: latest=false` lives in there; the raw `latest` tag below
      # re-adds it only for a stable release, so an rc/beta tag can never move
      # the `latest` that compose.example.yml pulls.
      #
      # `type=semver` reads the tag from `github.ref`, which is the pushed v*
      # tag here — a composite action shares the caller's github context, so
      # this keeps working unchanged.
      - name: Build and push the remo-web image
        uses: ./.github/actions/publish-web-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-spec: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.release.outputs.is_prerelease == 'false' }}
