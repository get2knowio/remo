name: Dependency Review

# Scans dependency manifest changes on pull requests for known-vulnerable
# packages and disallowed licenses, blocking the PR before they reach main.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true  # Superseded by a newer commit on the same ref — the check re-runs.

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v4
        with:
          fail-on-severity: high
