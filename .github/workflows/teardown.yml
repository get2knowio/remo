name: Teardown Server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm teardown (volume will be preserved)'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: teardown-${{ github.ref }}
  cancel-in-progress: false  # Never cancel — would orphan partially torn-down cloud resources.

jobs:
  teardown:
    name: Teardown Remote Coding Server
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Ansible and dependencies
        run: |
          # hcloud: the hetzner.hcloud collection imports it under this same
          # interpreter (plugins/hetzner/pyproject.toml).
          uv pip install --system ansible requests python-dateutil hcloud
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-galaxy collection install -r plugins/hetzner/src/remo_provider_hetzner/ansible/requirements.yml

      - name: Run teardown playbook (preserve volume)
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          # The playbooks ship in the remo-provider-hetzner plugin; run from
          # remo's ansible/ (its ansible.cfg and shared roles) and tell the
          # play where remo's shared tasks and defaults are, exactly as
          # core/ansible_runner.run_playbook(playbook_dir=...) does.
          cd ansible
          ansible-playbook ../plugins/hetzner/src/remo_provider_hetzner/ansible/hetzner_teardown.yml -e "{\"remo_core_ansible_dir\": \"$PWD\"}" -e auto_confirm=true
