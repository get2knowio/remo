version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock)
  #
  # Must be "uv", not "pip": this repo resolves from the committed uv.lock, and
  # the pip ecosystem does not update that file — it would bump pyproject.toml
  # and leave the lock (the thing CI and the Docker build actually install
  # from) untouched.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Let a new release settle before we bump to it, so we don't chase
    # immediately-yanked or regression releases.
    cooldown:
      default-days: 7
    groups:
      # One PR per week with all minor/patch production deps bumped together.
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # One PR per week with all minor/patch dev-only deps bumped together.
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Major bumps still get individual PRs so they can be reviewed carefully.

  # GitHub Actions workflow versions
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows/ and a ROOT-level action.yml — and nothing
    # else. Composite actions under .github/actions/** fall outside it whatever
    # the directory value, so each needs its own entry or its pinned `uses:`
    # SHAs are never bumped again. Moving the docker/* steps into
    # publish-web-image without this would have silently frozen five pins,
    # which is worse than the duplication it removed.
    # tests/unit/test_dependabot_config.py::test_every_composite_action_is_covered
    # fails if a new composite action is added without a line here.
    directories:
      - "/"
      - "/.github/actions/publish-web-image"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"

  # Docker base images. Two Dockerfiles ship images:
  #   /Dockerfile        — the CLI image (python:3.13-slim)
  #   /docker/Dockerfile — the remo-web service (node:24-slim, python:3.11-slim)
  # Nothing watched these before, so a base image could sit on an unpatched
  # tag indefinitely — the CVEs that matter for a container usually arrive via
  # the base image, not via the app's own dependencies.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      docker-images:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Dependabot picks the highest published tag and has no concept of
      # Node's release lines. Left alone it proposed node:20-slim ->
      # node:25-slim (#156): 25 is an odd-numbered "Current" release that
      # never becomes LTS and went EOL on 2026-06-01, so that bump would have
      # swapped one unpatched base image for another — the exact failure this
      # ecosystem entry exists to prevent. Node majors are picked by hand
      # instead, on the LTS cadence (even-numbered, each October). Minor and
      # patch bumps, which carry the base-image CVE fixes, keep flowing.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
