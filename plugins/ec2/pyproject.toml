[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remo-provider-ec2"
version = "0.1.0"
description = "AWS EC2 provider plugin for remo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # The real floor is the first remo-cli release with
    # ConnectionSpec.pre_connect_hook, ProviderDescriptor.legacy_type_names /
    # deprecated_cli_aliases and run_playbook(playbook_dir=) (4.5.0). It is
    # spelled >=4.4.2 only because that is still the workspace root's version
    # until release-please bumps it; tighten it when this distribution gets
    # its own release lane (#257).
    "remo-cli>=4.4.2",
    # Two consumers: provider.py's own lazy `import boto3`, AND the
    # amazon.aws/community.aws Ansible collections, which import it under
    # ansible_playbook_python -- the same environment remo runs in.
    "boto3",
]

[project.entry-points."remo.providers"]
ec2 = "remo_provider_ec2.descriptor:DESCRIPTOR"

[tool.hatch.build.targets.wheel]
# ansible/ (playbooks, roles, group_vars, requirements.yml) ships inside the
# package; provider.PLAYBOOK_DIR resolves it next to the module.
packages = ["src/remo_provider_ec2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
remo-cli = { workspace = true }
