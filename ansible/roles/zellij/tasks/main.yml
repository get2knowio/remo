---
# Zellij installation for Ubuntu
# Installs via apt if version is adequate, otherwise downloads binary release

- name: Check if zellij is already installed
  ansible.builtin.command: which zellij
  register: zellij_which_result
  changed_when: false
  failed_when: false

- name: Get installed zellij version
  ansible.builtin.command: zellij --version
  register: zellij_current_version
  changed_when: false
  failed_when: false
  when: zellij_which_result.rc | default(1) == 0

- name: Set zellij installed version fact
  ansible.builtin.set_fact:
    zellij_installed_version: >-
      {{ (zellij_current_version.stdout | default('zellij 0.0.0')).split(' ')[1] | default('0.0.0') }}
  when: zellij_which_result.rc | default(1) == 0

- name: Set zellij not installed fact
  ansible.builtin.set_fact:
    zellij_installed_version: "0.0.0"
  when: zellij_which_result.rc | default(1) != 0

- name: Install zellij via apt
  when: zellij_install_method in ['auto', 'apt']
  block:
    - name: Check apt version of zellij
      ansible.builtin.command: apt-cache policy zellij
      register: zellij_apt_policy
      changed_when: false
      failed_when: false

    - name: Parse apt zellij version
      ansible.builtin.set_fact:
        zellij_apt_version: >-
          {{ zellij_apt_policy.stdout | regex_search('Candidate: ([0-9]+\.[0-9]+\.[0-9]+)', '\1') | first | default('0.0.0') }}
      when: zellij_apt_policy.rc | default(1) == 0 and 'Candidate:' in zellij_apt_policy.stdout

    - name: Set apt version to 0 if not available
      ansible.builtin.set_fact:
        zellij_apt_version: "0.0.0"
      when: zellij_apt_version is not defined or zellij_apt_version == ''

    - name: Install zellij from apt if version is adequate
      ansible.builtin.apt:
        name: zellij
        state: present
        update_cache: true
      when:
        - zellij_apt_version is version(zellij_min_version, '>=')
        - zellij_installed_version is version(zellij_apt_version, '<')
      register: zellij_apt_install

- name: Install zellij from binary release
  when: >-
    (zellij_install_method == 'binary') or
    (zellij_install_method == 'auto' and (zellij_apt_version | default('0.0.0')) is version(zellij_min_version, '<'))
  block:
    - name: Get system architecture
      ansible.builtin.command: uname -m
      register: zellij_system_arch
      changed_when: false

    - name: Set architecture mapping
      ansible.builtin.set_fact:
        zellij_arch: "{{ 'x86_64' if (zellij_system_arch.stdout | default('')) == 'x86_64' else 'aarch64' }}"

    # Resolve "latest" WITHOUT api.github.com. That API allows only 60
    # unauthenticated requests per hour per IP -- a budget shared by everyone
    # behind the same NAT and by CI runners -- and this lookup used to abort
    # provisioning outright when it ran out (the 403 had no failure handling;
    # it surfaced as "Failed to create Incus container ... playbook rc=2").
    # github.com's own /releases/latest redirects to the tagged release and
    # carries no such quota, so read the tag out of the Location header and keep
    # the API off the provisioning path entirely.
    - name: Resolve latest zellij release via the github.com redirect
      ansible.builtin.uri:
        url: "{{ zellij_latest_release_url }}"
        method: HEAD
        follow_redirects: none
        status_code: [301, 302, 303, 307, 308]
      register: zellij_latest_redirect
      retries: 3
      delay: 5
      until: zellij_latest_redirect.location | default('') is search('/tag/')
      # Never fatal: a failed lookup falls back to the pinned version below.
      failed_when: false
      changed_when: false
      when: zellij_version == 'latest'

    - name: Set zellij download version
      ansible.builtin.set_fact:
        # The Location must actually look like .../tag/v1.2.3 before we trust
        # it; anything else (an error page, a redirect somewhere unexpected)
        # falls back rather than turning junk into a download URL.
        zellij_download_version: >-
          {{ zellij_version if zellij_version != 'latest'
             else ((zellij_latest_redirect.location | default('') | regex_replace('^.*/tag/v?', ''))
                   if (zellij_latest_redirect.location | default('')) is search('/tag/v?[0-9]+\.[0-9]+\.[0-9]+$')
                   else zellij_fallback_version) }}

    - name: Note that the pinned fallback version is being used
      ansible.builtin.debug:
        msg: >-
          Could not resolve the latest zellij release from github.com; installing the
          pinned fallback {{ zellij_fallback_version }} instead. This is not fatal.
      when:
        - zellij_version == 'latest'
        - (zellij_latest_redirect.location | default('')) is not search('/tag/v?[0-9]+\.[0-9]+\.[0-9]+$')

    - name: Check if we need to install/upgrade
      ansible.builtin.set_fact:
        zellij_needs_install: "{{ zellij_installed_version is version(zellij_download_version, '<') }}"

    - name: Download zellij binary
      when: zellij_needs_install
      block:
        - name: Create temporary directory for download
          ansible.builtin.tempfile:
            state: directory
          register: zellij_temp_dir

        - name: Download zellij tarball
          ansible.builtin.get_url:
            url: "https://github.com/zellij-org/zellij/releases/download/v{{ zellij_download_version }}/zellij-{{ zellij_arch }}-unknown-linux-musl.tar.gz"
            dest: "{{ zellij_temp_dir.path }}/zellij.tar.gz"
            mode: '0644'

        - name: Extract zellij binary
          ansible.builtin.unarchive:
            src: "{{ zellij_temp_dir.path }}/zellij.tar.gz"
            dest: "{{ zellij_temp_dir.path }}"
            remote_src: true

        - name: Install zellij to /usr/local/bin
          ansible.builtin.copy:
            src: "{{ zellij_temp_dir.path }}/zellij"
            dest: "{{ zellij_binary_path }}"
            mode: '0755'
            remote_src: true

        - name: Clean up temporary directory
          ansible.builtin.file:
            path: "{{ zellij_temp_dir.path }}"
            state: absent

- name: Verify zellij installation
  ansible.builtin.command: zellij --version
  register: zellij_final_version
  changed_when: false

- name: Display zellij version
  ansible.builtin.debug:
    msg: "{{ zellij_final_version.stdout | default('unknown') }}"

- name: Create zellij config directory for user
  ansible.builtin.file:
    path: "/home/{{ remo_user }}/.config/zellij"
    state: directory
    owner: "{{ remo_user }}"
    group: "{{ remo_user }}"
    mode: '0755'

- name: Create zellij layouts directory for user
  ansible.builtin.file:
    path: "/home/{{ remo_user }}/.config/zellij/layouts"
    state: directory
    owner: "{{ remo_user }}"
    group: "{{ remo_user }}"
    mode: '0755'

- name: Deploy zellij config for outer session
  ansible.builtin.template:
    src: config.kdl.j2
    dest: "/home/{{ remo_user }}/.config/zellij/config.kdl"
    owner: "{{ remo_user }}"
    group: "{{ remo_user }}"
    mode: '0644'

- name: Deploy minimal layout for outer zellij
  ansible.builtin.template:
    src: layouts/minimal.kdl.j2
    dest: "/home/{{ remo_user }}/.config/zellij/layouts/minimal.kdl"
    owner: "{{ remo_user }}"
    group: "{{ remo_user }}"
    mode: '0644'
