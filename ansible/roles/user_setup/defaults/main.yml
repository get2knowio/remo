---
remo_user: "remo"

# Seed the remo user's authorized_keys from the key the cloud provider injected
# elsewhere on the box (Hetzner -> root, EC2 -> ubuntu). Only Hetzner and AWS
# need this; Proxmox and Incus write the key straight into the remo user's file
# at create time, and running the bootstrap there overwrote keys placed by other
# tooling — notably the `remo-web@…` line `remo web push` installs (#121). Those
# two providers' configure/site playbooks set this false. Even where it does
# run, the bootstrap merges and only fires on first contact.
user_setup_bootstrap_cloud_keys: true

# Version displayed in project-menu banner
remo_version: ""

# Development workspace directory (parent folder for all projects)
dev_workspace_dir: "/home/{{ remo_user }}/projects"

# Zellij session name for SSH auto-attach
zellij_session_name: "main"

# Volume device for persistent home directory (set by hetzner_server role)
remo_volume_device: ""

# Devcontainer runtime baked into the project-launch scripts (spec 026).
#   "auto"         -> resolved on the host by tasks/resolve_devcontainer_runtime.yml:
#                     deacon for new hosts; the reference CLI for hosts that
#                     recorded it, legacy hosts that already have it, and
#                     hosts whose kernel refuses nested overlayfs (default)
#   "deacon"       -> single-binary Rust runtime (the default for new hosts)
#   "devcontainer" -> Node-based @devcontainers/cli, the reference runtime
# Set at provision time via the -e devcontainer_runtime=... extra var. The
# derived vars are late-bound on the EFFECTIVE runtime; when this role runs
# outside tasks/configure_dev_tools.yml (no resolver), an unresolved "auto"
# falls back to the reference CLI, the safe choice.
devcontainer_runtime: "auto"
devcontainer_cli_bin: "{{ 'deacon' if (devcontainer_runtime_effective | default(devcontainer_runtime)) == 'deacon' else 'devcontainer' }}"
# deacon gates host-side lifecycle hooks (initializeCommand, dotfiles) behind a
# workspace-trust check. remo's auto-start is non-interactive, so trust+persist
# the workspace on `up`; later exec calls then pass automatically.
devcontainer_up_extra_args: "{{ '--trust-workspace-persist' if (devcontainer_runtime_effective | default(devcontainer_runtime)) == 'deacon' else '' }}"
