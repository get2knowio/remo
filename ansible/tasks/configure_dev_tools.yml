---
# Shared dev tools configuration
# Include this from any playbook to install the standard dev environment
#
# Required: Run on a host with become: true and apt cache updated
#
# Optional variables to disable specific tools:
#   configure_docker: false
#   configure_user_setup: false
#   configure_nodejs: false
#   configure_devcontainers: false
#   configure_github_cli: false
#   configure_fzf: false
#   configure_zellij: false

# Decide the devcontainer runtime BEFORE anything that renders it (user_setup
# bakes it into the launcher scripts) — spec 026, contracts/runtime-resolution.md.
- name: Resolve the devcontainer runtime for this host
  ansible.builtin.include_tasks: tasks/resolve_devcontainer_runtime.yml

- name: Install base utilities
  ansible.builtin.apt:
    name:
      - rsync
    state: present

- name: Set system timezone
  community.general.timezone:
    name: "{{ timezone }}"
  when: timezone | default('') | length > 0

- name: Allow TZ environment variable via SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/accept-tz.conf
    content: |
      # Allow clients to propagate their timezone
      AcceptEnv TZ
    mode: '0644'
  register: sshd_tz_config

- name: Restart sshd to apply AcceptEnv TZ
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted
  when: sshd_tz_config.changed | default(false)

- name: Install Docker
  ansible.builtin.include_role:
    name: docker
  when: configure_docker | default(true) | bool

- name: Configure user environment
  ansible.builtin.include_role:
    name: user_setup
  vars:
    remo_version: "{{ remo_version | default('') }}"
  when: configure_user_setup | default(true) | bool

# Record the runtime this host got so later configure/upgrade runs keep it
# (stickiness — a host never changes runtime unless asked explicitly). Written
# once the account exists; content-compare keeps a second run at "ok".
- name: Record the devcontainer runtime for this host
  ansible.builtin.copy:
    dest: "/home/{{ remo_user }}/.remo-devcontainer-runtime"
    content: "{{ devcontainer_runtime_effective | default(devcontainer_runtime) }}\n"
    owner: "{{ remo_user }}"
    group: "{{ remo_user }}"
    mode: '0644'
  when: configure_devcontainers | default(true) | bool

- name: Install Node.js
  ansible.builtin.include_role:
    name: nodejs
  when: configure_nodejs | default(true) | bool

# Exactly one devcontainer runtime is installed and wired: the one
# tasks/resolve_devcontainer_runtime.yml resolved (deacon for new hosts;
# the reference CLI for legacy hosts, nested-overlayfs hosts, and explicit
# requests). Both stay governed by the `configure_devcontainers` tool toggle
# so --only/--skip keep working. Two runtimes on one host is unsupported:
# the other binary, if present from an earlier choice, is left inert.
- name: Install Dev Containers CLI (reference devcontainer runtime)
  ansible.builtin.include_role:
    name: devcontainers
  when:
    - configure_devcontainers | default(true) | bool
    - (devcontainer_runtime_effective | default(devcontainer_runtime)) != 'deacon'

- name: Install deacon (devcontainer runtime)
  ansible.builtin.include_role:
    name: deacon
  when:
    - configure_devcontainers | default(true) | bool
    - (devcontainer_runtime_effective | default(devcontainer_runtime)) == 'deacon'

# deacon on a host whose kernel refuses nested overlayfs is possible only by
# explicit request (auto keeps the reference CLI there) and has not been
# verified: the reference CLI's shim does not wrap deacon, so Compose-based
# builds may fail on the first RUN. Say so where the operator will see it.
- name: "Devcontainer runtime deacon on a nested-overlayfs host is NOT verified — Compose builds may fail; see docs/nested-overlayfs.md"
  ansible.builtin.debug:
    msg: >-
      auto would have kept the reference CLI here; deacon was requested
      explicitly. Export BUILDX_BUILDER=remo-native (and DOCKER_BUILDKIT=1
      COMPOSE_BAKE=1 for Compose projects) before building, and report the
      outcome — see docs/nested-overlayfs.md.
  when:
    - configure_devcontainers | default(true) | bool
    - (devcontainer_runtime_effective | default(devcontainer_runtime)) == 'deacon'
    - docker_nested_overlayfs | default(false) | bool

# Hosts whose kernel refuses nested overlayfs mounts cannot build ANY
# devcontainer with the stock Docker setup (#160), and the obvious workaround
# for that breaks Compose-based ones (#171). Both fixes are user-scoped, so
# this has to run after user_setup (the account and its docker-group
# membership) and after the devcontainer runtime it shims. It has no
# configure_* toggle of its own: it is a repair for the tools already selected,
# not another tool, and it no-ops on every host that does not need it.
- name: Work around a kernel that refuses nested overlayfs mounts
  ansible.builtin.include_role:
    name: nested_docker
  when: docker_nested_overlayfs | default(false) | bool

- name: Install GitHub CLI
  ansible.builtin.include_role:
    name: github_cli
  when: configure_github_cli | default(true) | bool

- name: Configure fzf
  ansible.builtin.include_role:
    name: fzf
  when: configure_fzf | default(true) | bool

- name: Install Zellij
  ansible.builtin.include_role:
    name: zellij
  when: configure_zellij | default(true) | bool

- name: Write remo version marker
  ansible.builtin.copy:
    content: "{{ remo_version | default('') }}"
    dest: "/home/{{ remo_user | default('remo') }}/.remo-version"
    owner: "{{ remo_user | default('remo') }}"
    group: "{{ remo_user | default('remo') }}"
    mode: '0644'
  when: remo_version | default('') | length > 0
